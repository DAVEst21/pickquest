services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pickquest
      POSTGRES_PASSWORD: pickquest
      POSTGRES_DB: pickquest
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickquest -d pickquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Los valores se pueden sobrescribir con un archivo .env en la raíz del repo.
    environment:
      DATABASE_URL: postgresql://pickquest:pickquest@db:5432/pickquest
      DIRECT_URL: postgresql://pickquest:pickquest@db:5432/pickquest
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    # El navegador llama al backend por el puerto publicado en el host.
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      # Los bind mounts de Windows/macOS no avisan de los cambios de archivos: sin
      # polling, Vite sigue sirviendo módulos viejos hasta reiniciar el contenedor.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Suite de navegador (Playwright). No arranca con `docker compose up`; se corre con
  #   docker compose --profile e2e run --rm e2e
  # Usa el usuario demo (reinicia su progreso) y guarda las capturas en docs/capturas/.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app
    environment:
      # El navegador de la prueba cree que está en localhost; estas rutas lo conectan al compose.
      E2E_PROXY: "1"
      E2E_FRONT_URL: http://frontend:5173
      E2E_BACK_URL: http://backend:3000
      E2E_DATABASE_URL: postgresql://pickquest:pickquest@db:5432/pickquest
      E2E_CAPTURAS: /docs/capturas
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./docs:/docs
    depends_on:
      - db
      - backend
      - frontend
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

volumes:
  db_data:
